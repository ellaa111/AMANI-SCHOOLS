<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ code }} - Amani Schools</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f4f5f7; margin: 0;
           display: flex; min-height: 100vh; align-items: center; justify-content: center; }
    main { background: #fff; padding: 2.5rem 3rem; border-radius: 12px;
           box-shadow: 0 2px 12px rgba(0,0,0,.08); text-align: center; max-width: 420px; }
    h1 { font-size: 3.5rem; margin: 0; color: #1b4f72; }
    h2 { margin: .5rem 0; }
    a  { color: #1b4f72; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>{{ code }}</h1>
    <h2>{{ title }}</h2>
    <p>{{ message }}</p>
    <a href="{{ url_for('dashboard') }}">Back to dashboard</a>
  </main>
</body>
</html>
